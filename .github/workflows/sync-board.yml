name: sync-board

on:
  push:
    branches: [main]
    paths:
      - docs/specs/**

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - id: token
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if [ -n "$BOARD_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no BOARD_TOKEN secret: the board sync runs in the loop, on the machine"
          fi
      - if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: uv run --directory tools python -m board.sync
      - if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          if git diff --quiet -- docs/specs; then
            echo "the spec frontmatter is already current"
            exit 0
          fi
          branch="docs/sync-board-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add docs/specs
          git commit -m "chore: write the issue numbers into the spec frontmatter"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: write the issue numbers into the spec frontmatter" \
            --body "The board sync ran on main and the frontmatter moved."
          gh pr merge "$branch" --squash --auto --delete-branch
