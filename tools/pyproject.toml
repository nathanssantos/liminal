[project]
name = "liminal-tools"
version = "0.0.0"
description = "liminal's Python tools: the audio analyzer worker and the spec/board sync"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.2"]

[dependency-groups]
dev = ["mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["analyzer", "board", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
